name: Build GeoSem iOS App

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
        
    - name: Install Flutter dependencies
      run: flutter pub get
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install CocoaPods
      run: |
        cd ios
        pod install
        
    - name: Build iOS App (Debug)
      run: |
        flutter build ios --debug --no-codesign
        
    - name: Build iOS App (Release)
      run: |
        flutter build ios --release --no-codesign
        
    - name: Create IPA Archive
      run: |
        cd ios
        xcodebuild -workspace Runner.xcworkspace \
                  -scheme Runner \
                  -configuration Release \
                  -archivePath build/Runner.xcarchive \
                  archive
        
    - name: Export IPA
      run: |
        cd ios
        xcodebuild -exportArchive \
                  -archivePath build/Runner.xcarchive \
                  -exportOptionsPlist ExportOptions.plist \
                  -exportPath build/outputs
        
    - name: Upload iOS Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ios-build
        path: |
          ios/build/outputs/*.ipa
          build/ios/framework/*.framework
        retention-days: 30
        
    - name: Generate Build Summary
      run: |
        echo "## 🎓 GeoSem iOS Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Build Status: Success" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Build Details:" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform**: iOS" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter Version**: $(flutter --version | head -1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Xcode Version**: $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type**: Release" >> $GITHUB_STEP_SUMMARY
        echo "- **KNUST Branding**: ✅ Included" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎨 Features:" >> $GITHUB_STEP_SUMMARY
        echo "- KNUST Green & Gold Theme" >> $GITHUB_STEP_SUMMARY
        echo "- WebView React Integration" >> $GITHUB_STEP_SUMMARY
        echo "- Native iOS Performance" >> $GITHUB_STEP_SUMMARY
        echo "- Seminar Management System" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "- iOS IPA file ready for distribution" >> $GITHUB_STEP_SUMMARY
        echo "- Framework files included" >> $GITHUB_STEP_SUMMARY
