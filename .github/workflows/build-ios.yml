name: Build GeoSem iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14  # Use current supported version
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
        
    - name: Install Flutter dependencies
      run: flutter pub get
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'  # Use current stable version
        
    - name: Install CocoaPods
      run: |
        cd ios
        pod install
        
    - name: Build iOS App
      run: |
        flutter build ios --release --no-codesign
        
    - name: Create Archive
      run: |
        cd ios
        xcodebuild -workspace Runner.xcworkspace \
                  -scheme Runner \
                  -configuration Release \
                  -archivePath build/Runner.xcarchive \
                  archive
        
    - name: Export IPA
      run: |
        cd ios
        xcodebuild -exportArchive \
                  -archivePath build/Runner.xcarchive \
                  -exportOptionsPlist ExportOptions.plist \
                  -exportPath build/outputs || echo "Export failed - archive created"
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ios-build
        path: |
          ios/build/outputs/*.ipa
          ios/build/Runner.xcarchive/**
        retention-days: 7
        
    - name: Build Summary
      run: |
        echo "## 🎓 GeoSem iOS Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Status: Success" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Platform: iOS" >> $GITHUB_STEP_SUMMARY
        echo "### 🎨 KNUST Branding: Included" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts: Available for download" >> $GITHUB_STEP_SUMMARY
